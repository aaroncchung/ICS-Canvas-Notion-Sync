version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # TypeScript 6 supplies the JavaScript API required by typescript-eslint;
    # TypeScript 7 is installed separately as typescript-native for CLI builds.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node types track the runtime pinned by engines and the workflows' node-version;
      # bump the major by hand when those move.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
