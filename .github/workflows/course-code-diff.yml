name: Course-code extraction comparison

on:
  workflow_dispatch:

concurrency:
  group: canvas-notion-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --fund=false
      - run: npm run build
      - name: Compare legacy and current course-code extraction against the real feed
        env:
          CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ASSIGNMENTS_DATA_SOURCE_ID: ${{ vars.NOTION_ASSIGNMENTS_DATA_SOURCE_ID }}
          NOTION_COURSES_DATA_SOURCE_ID: ${{ vars.NOTION_COURSES_DATA_SOURCE_ID }}
          NOTION_SYNC_LOG_DATA_SOURCE_ID: ${{ vars.NOTION_SYNC_LOG_DATA_SOURCE_ID }}
          NOTION_TIMEZONE: ${{ vars.NOTION_TIMEZONE || 'America/Los_Angeles' }}
          CANVAS_MISSING_EVIDENCE_MINIMUM_HOURS: ${{ vars.CANVAS_MISSING_EVIDENCE_MINIMUM_HOURS || '6' }}
        run: node dist/scripts/course-code-diff.js
