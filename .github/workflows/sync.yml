name: Canvas–Notion sync

on:
  schedule:
    - cron: "30 1,8,12,15,17 * * *"
      timezone: "America/New_York"
    - cron: "0 14 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: sync
        type: choice
        options:
          - sync
          - dry-run
          - validate
      disable_removals:
        description: Disable removed-assignment detection
        required: true
        default: false
        type: boolean

concurrency:
  group: canvas-notion-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --fund=false
      - run: npm run build
      - name: Synchronize assignments
        shell: bash
        env:
          CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ASSIGNMENTS_DATA_SOURCE_ID: ${{ vars.NOTION_ASSIGNMENTS_DATA_SOURCE_ID }}
          NOTION_COURSES_DATA_SOURCE_ID: ${{ vars.NOTION_COURSES_DATA_SOURCE_ID }}
          NOTION_SYNC_LOG_DATA_SOURCE_ID: ${{ vars.NOTION_SYNC_LOG_DATA_SOURCE_ID }}
          NOTION_TIMEZONE: ${{ vars.NOTION_TIMEZONE || 'America/Los_Angeles' }}
          CANVAS_MISSING_EVIDENCE_MINIMUM_HOURS: ${{ vars.CANVAS_MISSING_EVIDENCE_MINIMUM_HOURS || '6' }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'sync' || inputs.mode }}
          RUN_TRIGGER: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
          DISABLE_REMOVALS: ${{ inputs.disable_removals || false }}
        run: |
          args=(--mode "$RUN_MODE" --trigger "$RUN_TRIGGER")
          if [[ "$DISABLE_REMOVALS" == "true" ]]; then args+=(--disable-removals); fi
          node dist/src/cli.js "${args[@]}"
