name: Canvas–Notion sync

on:
  # Manual only here. GitHub disables scheduled workflows in public repositories after 60 days
  # without a commit, so a private runner repository runs a copy of this file on a schedule; see
  # "Scheduled runs" in docs/notion-setup.md.
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: sync
        type: choice
        options:
          - sync
          - dry-run
          - validate
          - compare-course-codes
      disable_removals:
        description: Disable removed-assignment detection
        required: true
        default: false
        type: boolean

concurrency:
  group: canvas-notion-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # Node 24 runs the TypeScript sources directly, so only runtime dependencies are installed.
      - run: npm ci --omit=dev --no-audit --fund=false
      - name: Synchronize assignments
        shell: bash
        env:
          CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ASSIGNMENTS_DATA_SOURCE_ID: ${{ vars.NOTION_ASSIGNMENTS_DATA_SOURCE_ID }}
          NOTION_COURSES_DATA_SOURCE_ID: ${{ vars.NOTION_COURSES_DATA_SOURCE_ID }}
          NOTION_SYNC_LOG_DATA_SOURCE_ID: ${{ vars.NOTION_SYNC_LOG_DATA_SOURCE_ID }}
          NOTION_TIMEZONE: ${{ vars.NOTION_TIMEZONE || 'America/Los_Angeles' }}
          CANVAS_MISSING_EVIDENCE_MINIMUM_HOURS: ${{ vars.CANVAS_MISSING_EVIDENCE_MINIMUM_HOURS || '6' }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'sync' || inputs.mode }}
          RUN_TRIGGER: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
          DISABLE_REMOVALS: ${{ inputs.disable_removals || false }}
        run: |
          if [[ "$RUN_MODE" == "compare-course-codes" ]]; then
            # Read-only: compares legacy and current course-code extraction against the real feed.
            node scripts/course-code-diff.ts
            exit
          fi
          args=(--mode "$RUN_MODE" --trigger "$RUN_TRIGGER")
          if [[ "$DISABLE_REMOVALS" == "true" ]]; then args+=(--disable-removals); fi
          node src/cli.ts "${args[@]}"
