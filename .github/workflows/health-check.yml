name: Canvas–Notion sync health

on:
  schedule:
    - cron: "47 */4 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write
  contents: read

concurrency:
  group: canvas-notion-health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --fund=false
      - run: npm run build
      - name: Inspect scheduled sync runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_ACTIVATION_GRACE_HOURS: ${{ vars.HEALTH_ACTIVATION_GRACE_HOURS || '14' }}
        run: node dist/scripts/check-health.js
