name: Canvas–Notion sync health

on:
  schedule:
    - cron: "47 */4 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write
  contents: read

concurrency:
  group: canvas-notion-health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect scheduled sync runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node dist/scripts/check-health.js
