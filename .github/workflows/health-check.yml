name: Canvas–Notion sync health

on:
  schedule:
    - cron: "47 */4 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write
  contents: read

concurrency:
  group: canvas-notion-health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The monitor has no npm dependencies; Node 24 runs the TypeScript source directly.
      - name: Inspect scheduled sync runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_ACTIVATION_GRACE_HOURS: ${{ vars.HEALTH_ACTIVATION_GRACE_HOURS || '14' }}
        run: node scripts/check-health.ts
